          description: Identificador del tipo de equipo (`EquipmentTypeId`).
          example: 1
        name:
          $ref: '#/components/schemas/EquipmentTypeName'
        limitMode:
          $ref: '#/components/schemas/LimitMode'
        minTemperatureC:
          $ref: '#/components/schemas/MinTemperatureC'
        maxTemperatureC:
          $ref: '#/components/schemas/MaxTemperatureC'
        toleranceK:
          $ref: '#/components/schemas/ToleranceK'
        isLimitDefined:
          type: boolean
          readOnly: true
          description: '`false` si el límite está pendiente de definir (sin `minTemperatureC` ni `maxTemperatureC` en modo `Range`, o sin `toleranceK` en modo `Band`).'
          example: true
        isLimitSuggested:
          type: boolean
          readOnly: true
          description: |
            `true` si los valores del límite son los sugeridos por la norma en los datos iniciales (p. ej. +2 … +8 °C
            para refrigeradoras, OMS PQS E003) y el laboratorio todavía no los confirmó. Pasa a `false` al crear o
            editar el tipo (D-07).
          example: false
        minMeasurementPoints:
          $ref: '#/components/schemas/MinMeasurementPoints'
        minSessionDurationMinutes:
          $ref: '#/components/schemas/MinSessionDurationMinutes'
        description:
          $ref: '#/components/schemas/EquipmentTypeDescription'
        isActive:
          type: boolean
          description: Indica si el tipo se ofrece al registrar equipos nuevos.
          example: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Fecha y hora de creación, con desfase horario.
          example: '2026-09-01T08:00:00-05:00'
        updatedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Fecha y hora de la última edición, o `null` si nunca se editó.
          example: '2026-09-25T11:30:00-05:00'
    CreateEquipmentTypeResponse:
      description: Tipo de equipo recién creado. Igual que `EquipmentTypeResponse`.
      allOf:
        - $ref: '#/components/schemas/EquipmentTypeResponse'
    EquipmentTypeName:
      type: string
      description: Nombre único del tipo de equipo, sin espacios al inicio ni al final (`UQ_EquipmentType_Name`).
      minLength: 1
      maxLength: 100
      pattern: ^\S(.*\S)?$
      example: Congeladora
    LimitMode:
      type: string
      enum:
        - Range
        - Band
      default: Range
      description: |
        Criterio de límite del tipo de equipo (D-05, D-07). `Range`: límites absolutos; fuera de límite si la lectura es
        estrictamente mayor que `maxTemperatureC` o menor que `minTemperatureC`, y cualquiera de los dos puede faltar
        (refrigeradoras +2 … +8 °C, bancos de sangre +1 … +6 °C, congeladoras de plasma y ultracongeladoras solo con
        máximo). `Band`: fuera de límite si la lectura se aleja de la consigna de la sesión más que `toleranceK`, por
        arriba o por abajo (incubadoras, cámaras ambientales).
      example: Range
    ToleranceK:
      type: number
      format: double
      nullable: true
      description: |
        Tolerancia ± en K alrededor de la consigna, solo con `limitMode: Band` (`DECIMAL(4,2)`, 2 decimales como máximo).
        `null` = tolerancia pendiente. Con `limitMode: Range` debe omitirse o ser `null`.
      exclusiveMinimum: true
      minimum: 0
      maximum: 99.99
      multipleOf: 0.01
      default: null
      example: 0.5
    MinMeasurementPoints:
      type: integer
      format: int32
      description: |
        Puntos de medición mínimos que exige la norma del tipo de equipo (D-06); se copian en cada sesión y, con menos
        canales, el sistema advierte y exige confirmación (RN-20). 9 = 8 esquinas y el centro (IEC 60068-3-5,
        DKD-R 5-7, USP <1079.4>, hasta 2000 L); 27 = incubadoras y estufas de más de 50 L (DIN 12880).
        Máximo 27, el número máximo de canales por sesión.
      minimum: 1
      maximum: 27
      default: 9
      example: 9
    MinTemperatureC:
      type: number
      format: double
      nullable: true
      description: |
        Temperatura mínima admisible en °C, solo con `limitMode: Range`, con 2 decimales como máximo (`DECIMAL(6,2)`).
        Debe ser menor que `maxTemperatureC`. `null` = sin mínimo. Una lectura está fuera de límite si es
        estrictamente menor que este valor (RN-07).
      minimum: -9999.99
      maximum: 9999.99
      multipleOf: 0.01
      default: null
      example: 2
    MaxTemperatureC:
      type: number
      format: double
      nullable: true
      description: |
        Temperatura máxima admisible en °C, solo con `limitMode: Range`, con 2 decimales como máximo (`DECIMAL(6,2)`).
        `null` o ausente = sin máximo; sin mínimo ni máximo, el límite queda **pendiente** y las sesiones se capturan
        sin evaluarlo.
        Una lectura está fuera de límite si es estrictamente mayor que este valor (RN-07).
      minimum: -9999.99
      maximum: 9999.99
      multipleOf: 0.01
      default: null
      example: -5
    MinSessionDurationMinutes:
      type: integer
      format: int32
      description: |
        Duración mínima de sesión que exige el tipo de equipo, en minutos (`CK_EquipmentType_MinDuration`).
        No puede ser menor que la duración base de 60 minutos (RN-04). Para poder planificar sesiones,
        tampoco debería superar la duración máxima planificable (`AppSetting.MaxSessionMinutes`, 10 080 por defecto).
      minimum: 60
      maximum: 43200
      default: 60
      example: 120
    EquipmentTypeDescription:
      type: string
      nullable: true
      description: Descripción libre del tipo de equipo.
      maxLength: 500
      default: null
      example: Incubadoras de CO2 a 37 °C
    UpdateSettingsRequest:
      type: object
      description: Todos los parámetros (D-08, semántica de reemplazo de `PUT`).
      additionalProperties: false
