    ErrorResponse:
      type: object
      description: |
        Detalle del error según RFC 7807 (Problem Details for HTTP APIs), con las extensiones de ASP.NET Core
        `traceId` y `errors` (errores de validación por propiedad).
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: URI que identifica el tipo de problema. `about:blank` si no hay un tipo específico.
          default: about:blank
          example: https://tools.ietf.org/html/rfc9110#section-15.5.10
        title:
          type: string
          description: Resumen legible del tipo de problema. No cambia entre ocurrencias.
          example: Conflicto con el estado del recurso
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: Código de estado HTTP de esta respuesta.
          example: 409
        detail:
          type: string
          description: Explicación de esta ocurrencia concreta del problema.
          example: Ya existe el tipo de equipo Congeladora
        instance:
          type: string
          format: uri-reference
          description: URI de la solicitud que originó el problema.
          example: /api/v1/equipment-types
        traceId:
          type: string
          description: Identificador de la traza para correlacionar con los registros del servidor.
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
        existingId:
          type: integer
          format: int32
          minimum: 1
          description: Solo en el 409 de RUC duplicado; id de la empresa existente, para ofrecer abrirla (HU-01).
          example: 1
        errors:
          type: object
          description: |
            Mensajes de validación por propiedad (solo en errores 400). Hay dos orígenes:
            - Reglas del negocio (dominio): clave = propiedad en camelCase y mensaje en español de la historia;
              la respuesta incluye además `detail` e `instance`.
            - Formato del cuerpo (ASP.NET Core): campo obligatorio ausente (clave = propiedad, mensaje en español),
              propiedad desconocida (clave = ruta JSON, p. ej. `$.color`) o cuerpo vacío (clave vacía `""`).
              Los dos últimos mensajes los genera el framework en inglés; la respuesta no incluye `detail` ni `instance`.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            maxTemperatureC:
              - El límite admite como máximo 2 decimales
  responses:
    ValidationError:
      description: Cuerpo con formato o valores no válidos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
