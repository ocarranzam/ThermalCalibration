openapi: 3.0.3
info:
  title: ThermalCalibration API
  version: 1.3.0
  description: |
    API REST del Sistema de Monitoreo Térmico para Calibración de Equipos de Refrigeración.

    Contrato de la Web API (.NET 10, ASP.NET Core con controladores) de la fase 1 de ThermalCalibration.
    Implementación: `src/Thermal.Api/*/*Controller.cs`. Verificado contra la API en ejecución con
    `tools/contract-check` (ver `docs/validation.md` §5.2).

    Recursos de esta versión:
    - **Tipos de equipo** (agregado `EquipmentType`, HU-02): catálogo con el criterio de límite, que puede quedar
      pendiente, los puntos de medición mínimos y la duración mínima de sesión que exige cada tipo.
    - **Parámetros del sistema** (`AppSetting`, D-08) y catálogo fijo de **tipos de termopar** (sprint 1).
    - **Empresas cliente y equipos** (agregados `Company` y `Equipment`, HU-01, sprint 2).

    Convenciones:
    - Rutas en plural, minúsculas y kebab-case, versionadas con el prefijo `/api/v1`.
    - Propiedades JSON en camelCase, con los nombres del modelo de dominio y de la base.
    - Temperaturas en °C con punto decimal y como máximo 2 decimales. Fechas en ISO 8601 con desfase horario.
    - Errores en formato Problem Details (RFC 7807), con el tipo de contenido `application/problem+json`.
    - Control de concurrencia optimista: `POST`, `GET` y `PUT` devuelven `ETag`, y `PUT` acepta `If-Match`.
    - Fechas en la zona del laboratorio (America/Lima, `-05:00`), redondeadas al segundo.
    - Criterio de límite por tipo (D-05, D-07): `Range` (límites absolutos `minTemperatureC` y/o `maxTemperatureC`:
      refrigeradora +2 … +8 °C, congeladora solo máximo) o `Band` (consigna de la sesión ± `toleranceK`, por arriba o
      por abajo: incubadoras y cámaras ambientales). `isLimitSuggested` indica valores sugeridos por la norma en los
      datos iniciales, pendientes de confirmar. Puntos de medición mínimos por tipo (D-06), de 1 a 27.
    - No hay `DELETE`: tipos de equipo, empresas y equipos no se borran, se desactivan con `PUT` e
      `isActive: false` (HU-01, HU-02). Un método no admitido responde 405.

    Fuentes: `docs/architecture/domain-model.md`, `docs/specs/functional/03-user-stories.md` (HU-01, HU-02),
    `docs/specs/functional/05-data-model.md` y `docs/db/01-schema.sql`.
  license:
    name: Propietaria, uso interno del laboratorio
    url: https://github.com/ocarranzam/ThermalCalibration
servers:
  - url: http://{devHost}:8080
    description: Desarrollo con `docker compose up` (docker-compose.yml).
    variables:
      devHost:
        default: localhost
        description: Máquina donde corre Docker.
  - url: https://{devHost}:5001
    description: Desarrollo con `dotnet run --project src/Thermal.Api` (launchSettings.json).
    variables:
      devHost:
        default: localhost
        description: Máquina del desarrollador.
  - url: https://{labHost}:{port}
    description: Servicio de Windows (Kestrel) en la PC del laboratorio a la que se conecta el adquisidor.
    variables:
      labHost:
        default: thermal-lab-pc
        description: Nombre de red de la PC del laboratorio.
      port:
        default: '5001'
        description: Puerto HTTPS de Kestrel.
tags:
  - name: EquipmentTypes
    description: |
      Catálogo de tipos de equipo con su límite máximo y su duración mínima de sesión (HU-02, RN-04, RN-06 a RN-08).
      Solo el rol `Admin` crea o edita tipos. Cambiar un tipo no altera las sesiones ya iniciadas, que conservan
      una copia del límite tomada al iniciar (RN-08).
  - name: Settings
    description: |
      Parámetros del sistema (intervalo de muestreo, duraciones, descanso del kit y umbrales de alerta; D-08) y
      catálogo fijo de tipos de termopar. Todos los roles consultan; solo `Admin` edita los parámetros. Un cambio solo
      afecta a las sesiones que se inicien después, que guardan una copia (RN-08).
  - name: Companies
    description: |
      Empresas cliente identificadas por su RUC y sus equipos bajo prueba (HU-01). `Admin` y `Technician` registran y
      editan; `Supervisor` solo consulta. La marca y el modelo del equipo son obligatorios porque agrupan los perfiles
      de eficacia por modelo; un modelo inferido se registra con `isModelConfirmed: false`.
security:
  - bearerAuth: []
paths:
  /api/v1/equipment-types:
    post:
      tags:
        - EquipmentTypes
      operationId: createEquipmentType
      summary: Registrar un tipo de equipo
      description: |
        Crea un tipo de equipo activo, con el límite confirmado (`isLimitSuggested: false`). Por defecto el modo de
        límite es `Range`, los puntos de medición mínimos son 9 y la duración mínima de sesión es la base de 60 minutos.
        Sin `minTemperatureC` ni `maxTemperatureC` (modo `Range`) o sin `toleranceK` (modo `Band`), el límite queda
        **pendiente** y las sesiones de ese tipo se capturarán sin evaluar el límite (RN-09).
        Requiere el rol `Admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEquipmentTypeRequest'
            examples:
              limiteDefinido:
                summary: Tipo con límite definido
                value:
                  name: Ultracongeladora
                  maxTemperatureC: -60
                  minSessionDurationMinutes: 60
                  description: Equipos de -80 °C para vacunas y reactivos
              limitePendiente:
                summary: Tipo con límite pendiente
                value:
                  name: Cámara de vacunas
                  maxTemperatureC: null
              rangoRefrigeradora:
                summary: Refrigeradora de vacunas con rango de +2 a +8 °C (OMS PQS E003)
                value:
                  name: Refrigeradora de vacunas
                  limitMode: Range
                  minTemperatureC: 2
                  maxTemperatureC: 8
              bandaIncubadora:
                summary: Incubadora de más de 50 L con banda de ±0,5 K y 27 puntos (DIN 12880)
                value:
                  name: Incubadora de CO2
                  limitMode: Band
                  toleranceK: 0.5
                  minMeasurementPoints: 27
      responses:
        '201':
          description: Tipo de equipo creado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEquipmentTypeResponse'
              example:
                id: 5
                name: Ultracongeladora
                limitMode: Range
                minTemperatureC: null
                maxTemperatureC: -60
                toleranceK: null
                isLimitDefined: true
                isLimitSuggested: false
                minMeasurementPoints: 9
                minSessionDurationMinutes: 60
                description: Equipos de -80 °C para vacunas y reactivos
                isActive: true
                createdAt: '2026-09-25T10:15:00-05:00'
                updatedAt: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateName'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/equipment-types/{id}:
    parameters:
      - $ref: '#/components/parameters/EquipmentTypeId'
    get:
      tags:
        - EquipmentTypes
      operationId: getEquipmentType
      summary: Obtener un tipo de equipo
      description: Devuelve el tipo de equipo, activo o desactivado. Disponible para todos los roles.
      responses:
        '200':
          description: Tipo de equipo encontrado.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentTypeResponse'
              example:
                id: 2
                name: Refrigeradora
                limitMode: Range
                minTemperatureC: 2
                maxTemperatureC: 8
                toleranceK: null
                isLimitDefined: true
                isLimitSuggested: true
                minMeasurementPoints: 9
                minSessionDurationMinutes: 60
                description: Refrigeradoras de laboratorio de 2 a 8 °C
                isActive: true
                createdAt: '2026-09-01T08:00:00-05:00'
                updatedAt: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - EquipmentTypes
      operationId: updateEquipmentType
      summary: Reemplazar un tipo de equipo
      description: |
        Reemplaza todos los datos editables del tipo de equipo. El límite enviado queda **confirmado**
        (`isLimitSuggested: false`). Las propiedades que no se envían toman su valor
        por defecto: `limitMode` vuelve a `Range` con el límite pendiente, `minMeasurementPoints` vuelve a 9,
        `description` se vacía y `minSessionDurationMinutes` vuelve a 60.

        - Cambiar el límite o la duración mínima solo afecta a las sesiones que se inicien después (RN-08).
          Las sesiones en curso y las registradas conservan su límite aplicado y su duración planificada.
        - Un tipo con equipos asociados no se borra: se desactiva con `isActive: false`. Un tipo desactivado
          no se ofrece al registrar equipos nuevos.
        - Con `If-Match`, el cambio solo se aplica si el recurso no cambió desde que se leyó.
        - Si los datos enviados son iguales a los guardados, no se escribe nada: `updatedAt` y el `ETag` no cambian.

        Requiere el rol `Admin`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEquipmentTypeRequest'
            example:
              name: Congeladora
              maxTemperatureC: -8
              minSessionDurationMinutes: 60
              description: Congeladoras horizontales y verticales
              isActive: true
      responses:
        '200':
          description: Tipo de equipo actualizado.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentTypeResponse'
              example:
                id: 1
                name: Congeladora
                limitMode: Range
                minTemperatureC: null
                maxTemperatureC: -8
                toleranceK: null
                isLimitDefined: true
                isLimitSuggested: false
                minMeasurementPoints: 9
                minSessionDurationMinutes: 60
                description: Congeladoras horizontales y verticales
                isActive: true
                createdAt: '2026-09-01T08:00:00-05:00'
                updatedAt: '2026-09-25T11:30:00-05:00'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateName'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/settings:
    get:
      tags:
        - Settings
      operationId: getSettings
      summary: Obtener los parámetros del sistema
      description: |
        Devuelve los parámetros vigentes y `minValidSamples`, el mínimo de muestras válidas de una sesión base
        (`baseSessionMinutes × 60 / samplingIntervalSeconds + 1`). Disponible para todos los roles.
      responses:
        '200':
          description: Parámetros vigentes.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Settings
      operationId: updateSettings
      summary: Reemplazar los parámetros del sistema
      description: |
        Reemplaza todos los parámetros (D-08). Solo afecta a las sesiones que se inicien después (RN-08). El intervalo
        de muestreo debe dividir exactamente la duración base. Con `If-Match`, el cambio solo se aplica si ningún
        parámetro cambió desde que se leyeron. Si los valores son iguales a los guardados, no se escribe nada.
        Requiere el rol `Admin`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
      responses:
        '200':
          description: Parámetros actualizados.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/thermocouple-types:
    get:
      tags:
        - Settings
      operationId: listThermocoupleTypes
      summary: Listar los tipos de termopar
      description: Catálogo fijo de tipos de termopar con su rango de medición, ordenado por código.
      responses:
        '200':
          description: Tipos de termopar.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThermocoupleTypeResponse'
              example:
                - code: K
                  name: Termopar tipo K (cromel-alumel)
                  minRangeC: -200
                  maxRangeC: 1260
                - code: T
                  name: Termopar tipo T (cobre-constantán)
                  minRangeC: -200
                  maxRangeC: 350
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/companies:
    post:
      tags:
        - Companies
      operationId: createCompany
      summary: Registrar una empresa cliente
      description: |
        Registra una empresa activa. El RUC se valida (11 dígitos, prefijo 10, 15, 17 o 20 y dígito verificador
        módulo 11) y es único: si ya existe, responde 409 con `existingId` para ofrecer abrir la empresa existente.
        Requiere el rol `Admin` o `Technician`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
            example:
              taxId: '20100070970'
              name: Laboratorios Andinos S.A.C.
              contactName: Ana Torres
              phone: '+51 1 555 0100'
              email: calidad@andinos.pe
      responses:
        '201':
          description: Empresa registrada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateTaxId'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    get:
      tags:
        - Companies
      operationId: searchCompanies
      summary: Buscar empresas
      description: |
        Busca por RUC exacto y/o por parte de la razón social, sin distinguir mayúsculas. Sin filtros devuelve todas.
        Como máximo 100 resultados, ordenados por razón social. Incluye las empresas desactivadas.
      parameters:
        - name: taxId
          in: query
          required: false
          description: RUC exacto.
          schema:
            type: string
          example: '20100070970'
        - name: name
          in: query
          required: false
          description: Parte de la razón social.
          schema:
            type: string
          example: Andinos
      responses:
        '200':
          description: Empresas encontradas (puede estar vacío).
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/CompanyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/companies/{id}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags:
        - Companies
      operationId: getCompany
      summary: Obtener una empresa
      responses:
        '200':
          description: Empresa encontrada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Companies
      operationId: updateCompany
      summary: Reemplazar los datos de una empresa
      description: |
        Reemplaza los datos editables. El RUC no se edita. Las propiedades opcionales que no se envían se vacían.
        Una empresa no se borra: se desactiva con `isActive: false`. Requiere el rol `Admin` o `Technician`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: Empresa actualizada.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/companies/{id}/equipment:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags:
        - Companies
      operationId: createCompanyEquipment
      summary: Registrar un equipo de la empresa
      description: |
        Registra un equipo activo de la empresa. El tipo de equipo debe existir y estar activo. La serie es única dentro
        de la empresa (otra empresa puede tener la misma). Sin `isModelConfirmed`, el modelo se considera confirmado.
        Requiere el rol `Admin` o `Technician`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEquipmentRequest'
            examples:
              congeladora:
                summary: Equipo con el modelo leído en la placa
                value:
                  equipmentTypeId: 2
                  brand: Haier
                  model: HBF-205
                  serialNumber: SN-88231
              modeloInferido:
                summary: Modelo inferido con la ficha del fabricante (DATA-1)
                value:
                  equipmentTypeId: 5
                  brand: Memmert
                  model: TTC256
                  isModelConfirmed: false
                  serialNumber: DATA-1
      responses:
        '201':
          description: Equipo registrado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateSerial'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    get:
      tags:
        - Companies
      operationId: listCompanyEquipment
      summary: Listar los equipos de la empresa
      description: Equipos de la empresa, activos y desactivados, ordenados por número de serie.
      responses:
        '200':
          description: Equipos de la empresa (puede estar vacío).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquipmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/equipment/{id}:
    parameters:
      - $ref: '#/components/parameters/EquipmentId'
    get:
      tags:
        - Companies
      operationId: getEquipment
      summary: Obtener un equipo
      responses:
        '200':
          description: Equipo encontrado.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Companies
      operationId: updateEquipment
      summary: Reemplazar los datos de un equipo
      description: |
        Reemplaza los datos editables. La empresa no cambia. Solo se exige un tipo activo si el tipo cambia: un equipo
        conserva su tipo aunque este se haya desactivado. `isModelConfirmed: true` confirma el modelo leído en la placa.
        Un equipo no se borra: se desactiva con `isActive: false`. Requiere el rol `Admin` o `Technician`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEquipmentRequest'
      responses:
        '200':
          description: Equipo actualizado.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateSerial'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token con el rol del usuario (`Admin`, `Technician` o `Supervisor`). El mecanismo definitivo
        (cuentas locales con JWT o Windows/AD) está pendiente de decisión (c4-containers §3.1).
  parameters:
    EquipmentTypeId:
      name: id
      in: path
      required: true
      description: Identificador del tipo de equipo (`EquipmentTypeId`).
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 1
    CompanyId:
      name: id
      in: path
      required: true
      description: Identificador de la empresa (`CompanyId`).
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 1
    EquipmentId:
      name: id
      in: path
      required: true
      description: Identificador del equipo (`EquipmentId`).
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 1
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        `ETag` obtenido en la última lectura (se acepta con o sin el prefijo `W/`). Si no coincide con el
        actual, o no corresponde a ninguna versión, se responde 412. `*` o la cabecera ausente omiten la comprobación.
      schema:
        type: string
      example: '"AAAAAAAAB9E="'
  headers:
    Location:
      description: URL del recurso creado.
      schema:
        type: string
        format: uri-reference
      example: /api/v1/equipment-types/5
    ETag:
      description: Versión del recurso, para el control de concurrencia optimista con `If-Match`.
      schema:
        type: string
      example: '"AAAAAAAAB9E="'
  schemas:
    CreateEquipmentTypeRequest:
      type: object
      description: Datos para registrar un tipo de equipo. El tipo nace activo.
      additionalProperties: false
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/EquipmentTypeName'
        limitMode:
          $ref: '#/components/schemas/LimitMode'
        minTemperatureC:
          $ref: '#/components/schemas/MinTemperatureC'
        maxTemperatureC:
          $ref: '#/components/schemas/MaxTemperatureC'
        toleranceK:
          $ref: '#/components/schemas/ToleranceK'
        minMeasurementPoints:
          $ref: '#/components/schemas/MinMeasurementPoints'
        minSessionDurationMinutes:
          $ref: '#/components/schemas/MinSessionDurationMinutes'
        description:
          $ref: '#/components/schemas/EquipmentTypeDescription'
    UpdateEquipmentTypeRequest:
      type: object
      description: Representación completa de los datos editables del tipo de equipo (semántica de reemplazo de `PUT`).
      additionalProperties: false
