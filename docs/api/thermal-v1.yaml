          maximum: 900
          description: Intervalo de muestreo en segundos [PC-01]. Debe dividir exactamente la duración base.
          example: 60
        baseSessionMinutes:
          type: integer
          format: int32
          minimum: 30
          maximum: 240
          description: Duración base de una sesión en minutos.
          example: 60
        maxSessionMinutes:
          type: integer
          format: int32
          minimum: 30
          maximum: 43200
          description: Duración máxima planificable en minutos; no menor que la base (hasta 30 días).
          example: 10080
        restPeriodMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 240
          description: Descanso mínimo del kit de medición entre sesiones, en minutos.
          example: 15
        sensorLossThresholdPct:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          exclusiveMaximum: true
          maximum: 100
          multipleOf: 0.01
          description: Una muestra está afectada si MÁS de este % de canales no tiene lectura válida (2 decimales como máximo).
          example: 60
        sensorLossCriticalAfterSamples:
          type: integer
          format: int32
          minimum: 2
          maximum: 10
          description: La pérdida de sensores pasa a alerta crítica en la N-ésima muestra afectada consecutiva.
          example: 3
        sensorLossFailMinutes:
